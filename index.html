<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Feed | Tech, Gaming, Sports & Deals</title>
  <meta name="description" content="A curated aggregator of the latest news across tech, gaming, sports, and deals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <h1>John's <span>Site</span></h1>
        <p class="subtitle" id="last-updated">Fetching latest updates...</p>
      </div>

      <nav class="category-nav">
        <button class="nav-btn active" data-category="all">All News</button>
        <button class="nav-btn" data-category="tech">Tech</button>
        <button class="nav-btn" data-category="gaming">Gaming</button>
        <button class="nav-btn" data-category="sports">Sports</button>
        <button class="nav-btn" data-category="deals">Deals</button>
      </nav>
    </header>

    <main>
      <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Gathering intel...</p>
      </div>

      <div id="error-state" class="error-state hidden">
        <h2>Oops! Signal lost.</h2>
        <p>Couldn't load the news feed. Are the JSON files generated?</p>
        <button id="retry-btn" class="retry-btn">Retry Connection</button>
      </div>

      <div id="articles-list" class="articles-list hidden">
        <!-- Articles injected by app.js -->
      </div>
    </main>
  </div>

  <script src="app.js" type="module"></script>
</body>

</html>
